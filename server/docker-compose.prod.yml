version: '3.8'

services:
  # ── 1. PostgreSQL 16 Database ──
  postgres:
    image: postgres:16-alpine
    container_name: movemall-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-movemall}
      POSTGRES_USER: ${POSTGRES_USER:-movemall_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=32MB
      -c maintenance_work_mem=256MB
      -c max_connections=200
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-movemall_admin} -d ${POSTGRES_DB:-movemall}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - movemall-network

  # ── 2. Redis 7 (In-Memory Cache & Pub/Sub) ──
  redis:
    image: redis:7-alpine
    container_name: movemall-redis
    restart: always
    command: redis-server --maxmemory 1gb --maxmemory-policy allkeys-lru --save "" --appendonly no
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - movemall-network

  # ── 3. PgBouncer (High Concurrency Connection Pooler) ──
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: movemall-pgbouncer
    restart: always
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-movemall_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-movemall}
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 50
      MIN_POOL_SIZE: 10
      RESERVE_POOL_SIZE: 15
      MAX_CLIENT_CONN: 5000
      SERVER_IDLE_TIMEOUT: 600
      QUERY_WAIT_TIMEOUT: 120
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - movemall-network

  # ── 4. Movemall Backend API & WebSocket ──
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movemall-api
    restart: always
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-movemall_admin}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-movemall}?schema=public&pgbouncer=true
      DATABASE_URL_DIRECT: postgres://${POSTGRES_USER:-movemall_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-movemall}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - movemall-network

  # ── 5. Nginx Reverse Proxy (SSL & WebSocket Support) ──
  nginx:
    image: nginx:alpine
    container_name: movemall-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - api
    networks:
      - movemall-network

volumes:
  pgdata:
  redisdata:

networks:
  movemall-network:
    driver: bridge
