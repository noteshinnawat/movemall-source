ด# SRS (Simple Realtime Server) Configuration for Movemall Live Shopping
# Supports RTMP Ingest, HLS (.m3u8) Playback, HTTP-FLV, and WebRTC

listen              1935;
max_connections     10000;
srs_log_tank        console;

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
    crossdomain     on;
}

http_api {
    enabled         on;
    listen          1985;
    crossdomain     on;
}

stats {
    network         0;
}

vhost __defaultVhost__ {
    # Low-latency HLS for Web/Mobile Shopping Video Player
    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    2;
        hls_window      10;
        hls_cleanup     on;
        hls_dispose     30;
    }

    # HTTP-FLV for Ultra-low latency Desktop & Mobile Player (~1s latency)
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }

    # WebRTC for Realtime interaction (< 500ms latency)
    rtc {
        enabled     on;
        bframe      discard;
    }
}
