<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Primary Background Gradient: Movemall Royal Blue to Sapphire -->
    <linearGradient id="movemallBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="55%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>

    <!-- Red Vivid Accent Gradient for Live Stream Badge -->
    <linearGradient id="liveBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>

    <!-- Top Gloss Surface -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft Drop Shadow for Icon Depth -->
    <filter id="shadowFx" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.32"/>
    </filter>

    <filter id="badgeShadowFx" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle Base for App Icon & PWA (iOS/Android Modern Rounded Rectangle) -->
  <rect width="512" height="512" rx="116" fill="url(#movemallBg)"/>

  <!-- Top Gloss Highlight Surface -->
  <rect width="512" height="256" rx="116" fill="url(#glossGrad)"/>

  <!-- Main Emblem Group -->
  <g filter="url(#shadowFx)">
    <!-- Shopping Bag Handle Arc (White) -->
    <path d="M 194 162 C 194 116, 318 116, 318 162" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round"/>

    <!-- Geometric Bold "M" Movemall Shopping Bag Body -->
    <path d="M 132 192 C 132 174, 146 160, 164 160 L 188 160 C 199 160, 210 166, 217 176 L 256 236 L 295 176 C 302 166, 313 160, 324 160 L 348 160 C 366 160, 380 174, 380 192 L 380 352 C 380 370, 366 384, 348 384 L 330 384 C 312 384, 298 370, 298 352 L 298 266 L 268 312 C 262 321, 250 321, 244 312 L 214 266 L 214 352 C 214 370, 200 384, 182 384 L 164 384 C 146 384, 132 370, 132 352 Z" fill="#FFFFFF"/>
  </g>

  <!-- Live Stream / Flash Sale Red Radar Badge (Top Right) -->
  <g filter="url(#badgeShadowFx)">
    <circle cx="374" cy="146" r="34" fill="url(#liveBadgeGrad)" stroke="#FFFFFF" stroke-width="7"/>
    <!-- White Play Triangle -->
    <polygon points="368,134 388,146 368,158" fill="#FFFFFF"/>
  </g>
</svg>